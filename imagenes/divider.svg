<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 40" width="1000" height="40" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="l" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#00c6ff" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#00c6ff"/>
      <stop offset="0.5" stop-color="#ffd84a"/>
      <stop offset="0.7" stop-color="#1e56d9"/>
      <stop offset="1" stop-color="#1e56d9" stop-opacity="0"/>
      <animate attributeName="x1" values="0;0.5" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;1.5" dur="3s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect x="40" y="18" width="920" height="4" rx="2" fill="url(#l)"/>
  <g transform="translate(500,20)">
    <circle r="11" fill="#fff" stroke="#111" stroke-width="2"/>
    <polygon points="0,-5 4.8,-1.5 3,4 -3,4 -4.8,-1.5" fill="#111"/>
    <animateTransform attributeName="transform" type="translate" values="60,20;940,20;60,20" dur="6s" repeatCount="indefinite" additive="replace"/>
  </g>
  <g transform="translate(60,20)">
    <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/></g>
  </g>
</svg>