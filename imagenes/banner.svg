  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03060f"/>
      <stop offset="0.6" stop-color="#0a1f5c"/>
      <stop offset="1" stop-color="#1246c2"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#8fd8ff"/>
      <stop offset="0.65" stop-color="#ffd84a"/>
      <stop offset="1" stop-color="#ffffff"/>
      <animate attributeName="x1" values="0;1" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;2" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="ballg" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9d3e6"/>
    </radialGradient>
    <radialGradient id="shine" cx="0.3" cy="0.25" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="ballclip"><circle r="40"/></clipPath>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe6ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#bfe6ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="round"><rect width="1000" height="320" rx="22"/></clipPath>
  </defs>

